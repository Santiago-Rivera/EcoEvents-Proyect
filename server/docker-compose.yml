version: '3.8'

services:
  ecoevents-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoevents-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      # Persistir la base de datos SQLite
      - ecoevents_data:/app/data
      # Montar archivos de configuración (opcional para desarrollo)
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ecoevents-network

  # Opcional: Servicio para desarrollo con hot-reload
  ecoevents-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ecoevents-api-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - .:/app
      - /app/node_modules
      - ecoevents_dev_data:/app/data
    command: npm run dev
    profiles:
      - dev
    networks:
      - ecoevents-network

volumes:
  ecoevents_data:
    driver: local
  ecoevents_dev_data:
    driver: local

networks:
  ecoevents-network:
    driver: bridge
